<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - GameSadyg</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/light.css">
    <link rel="stylesheet" href="css/adaptive.css">
</head>

<body>
    <!-- Форма регистрации нового пользователя. -->
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="header__logo"><img src="images/logotip.svg"
                    alt="Логотип"><span>GameSadyg</span></a>
            <div class="header__burger" id="burger">☰</div>
            <nav class="header__nav" id="nav">
                <a href="index.html" class="header__link">Главная</a>
                <a href="catalog.html" class="header__link">Каталог</a>
                <a href="login.html" class="header__link">Вход</a>
                <button class="button button--small" id="themeToggle" type="button">Светлая тема</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero hero--auth">
            <div class="container hero__content reveal visible">
                <h1 class="hero__brand">Регистрация</h1>
                <h2 class="hero__title">Создайте аккаунт и откройте весь GameSadyg</h2>
                <p class="hero__text">После регистрации вы сможете собирать библиотеку игр, участвовать в сообществе и
                    получать персональные предложения.</p>
            </div>
        </section>

        <section class="auth reveal">
            <div class="container">
                <form class="form">
                    <h2 class="section-title" style="text-align:left; margin-bottom:0.25rem;">Создание аккаунта</h2>
                    <label class="form__label">Имя</label>
                    <input type="text" class="form__input" required>
                    <label class="form__label">E-mail</label>
                    <input type="email" class="form__input" required>
                    <label class="form__label">Пароль</label>
                    <input type="password" class="form__input" required>
                    <label class="form__label">Подтвердите пароль</label>
                    <input type="password" class="form__input" required>
                    <button class="button" type="submit">Зарегистрироваться</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p>© <span class="js-year"></span> GameSadyg</p>
            <nav class="footer__nav"><a href="login.html">Уже есть аккаунт?</a><a href="catalog.html">Каталог</a></nav>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>
